# Focus-topic vocabulary — every topic is a curated selection of IPTC
# Media Topics subtrees. Semantics, precedence rules and the activation
# checklist are specified in docs/classification.md §6.
#
# Codes are IPTC Media Topics NewsCodes (© IPTC, CC BY 4.0),
# https://cv.iptc.org/newscodes/mediatopic/ — a code claims the concept
# AND its narrower concepts. Comments give the German / English
# prefLabels of the 2021 vocabulary release for human readers.
#
# status: active   — wired into Classifier::TOPIC_ORDER and Registry::TOPICS
# status: proposed — agreed direction, not yet activated (see TODO.md)

