- id: occrp
  name: OCCRP
  wikidata: Q7102061
  country: US
  languages: [en]
  type: ngo-media
  ownership: foundation
  publisher: Journalism Development Network, Inc.
  funding: [grants, government-grants]
  perspective: international
  topics: [democracy]
  homepage: https://www.occrp.org
  feeds:
    - https://www.occrp.org/en/feed
  rating:
    economic: -0.5
    cultural: -1.0
    eu_stance: 1.0
    party_family: nonpartisan
    reliability: 4
    transparency: medium
    state_influence: none
    confidence: medium
    evidence:
      - url: https://www.occrp.org/en/about-us
        note: Cross-border investigative network (70+ member centres, strongest in Eastern Europe/Caucasus/Central Asia) with first-rate investigative standards; US non-profit, operationally run from Amsterdam.
      - url: https://www.dropsitenews.com/p/occrp-budget-funding-us-government-usaid
        note: NDR/Drop Site (2024) documented that ~52% of 2013–2024 spending came from the US government incl. reported approval rights over senior staff, which OCCRP's board disputes; the 2025 US aid freeze then cut ~29% of its budget. Transparency medium and confidence medium reflect this unresolved dispute, not the journalism itself.

