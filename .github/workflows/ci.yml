name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite backs the optional accounts; the rest is the app's own
          # requirement set from composer.json.
          extensions: curl, mbstring, pdo_sqlite, simplexml
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Tests
        run: vendor/bin/phpunit

      # The dataset is a contract, not just data: ratings need evidence,
      # topics must stay in sync with the code (docs/classification.md §6).
      - name: Dataset gate
        run: bin/meridian sources:validate
